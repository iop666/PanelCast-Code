[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelcast"
version = "0.2.0"
description = "PanelCast source ingestion: EPUB chapter text + MOBI page images (stdlib only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
panelcast = "panelcast.__main__:main"

[tool.setuptools]
packages = ["panelcast"]
