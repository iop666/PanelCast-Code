<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PanelCast M1 分格编辑器</title>
<style>
  :root { --line: #d0d4dc; --accent: #1a73e8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #222; }
  header { display: flex; gap: 16px; align-items: center; padding: 8px 14px;
           border-bottom: 1px solid var(--line); background: #f7f8fa; }
  header .rtl { background: #1a73e8; color: #fff; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
  header .stats { font-weight: 600; }
  header .hint { color: #777; margin-left: auto; font-size: 12px; }
  button { padding: 4px 12px; border: 1px solid var(--line); background: #fff;
           border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #layout { display: flex; height: calc(100vh - 46px); }
  #page-list { width: 200px; margin: 0; padding: 8px; list-style: none;
               overflow-y: auto; border-right: 1px solid var(--line); }
  #page-list li { padding: 6px 10px; margin: 2px 0; border-radius: 4px; cursor: pointer;
                  display: flex; justify-content: space-between; }
  #page-list li:hover { background: #eef3fe; }
  #page-list li.current { background: var(--accent); color: #fff; }
  #page-list li .mark { font-weight: 700; }
  #page-list li .mark.ok { color: #1a8f3c; }
  #page-list li.current .mark.ok { color: #c8f7d2; }
  #viewport { flex: 1; overflow: auto; background: #525659; position: relative; }
  #stage { position: relative; margin: 20px auto; background: #fff;
           box-shadow: 0 2px 14px rgba(0,0,0,.5); }
  #stage img { display: block; width: 100%; height: 100%; user-select: none;
               -webkit-user-drag: none; }
  .box { position: absolute; border: 2px solid #ff3b30; cursor: move; }
  .box.selected { border-color: #ff9500; box-shadow: 0 0 0 2px #ff950055; }
  .box .badge { position: absolute; top: -14px; left: -2px; background: #ff3b30; color: #fff;
                font-size: 11px; padding: 0 6px; border-radius: 3px; font-weight: 700; }
  .box.selected .badge { background: #ff9500; }
  .box .badge.first { background: #1a8f3c; }
  .box .handle { position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
                 background: #fff; border: 2px solid currentColor; border-radius: 2px;
                 cursor: nwse-resize; }
  .box .ctl { position: absolute; top: -14px; right: -2px; display: none; }
  .box .ctl button { padding: 0 5px; font-size: 11px; line-height: 16px; }
  .box:hover .ctl, .box.selected .ctl { display: flex; }
  .creating { position: absolute; border: 2px dashed var(--accent); background: #1a73e822; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: #333; color: #fff; padding: 6px 16px; border-radius: 4px;
           opacity: 0; transition: opacity .25s; pointer-events: none; }
  /* ---- 标签页 ---- */
  .tabs { display: flex; gap: 4px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #page-list li .pm { font-size: 11px; color: #999; margin-left: 4px; }
  #page-list li .pm.reviewed { color: #1a8f3c; font-weight: 700; }
  /* ---- 介绍页面板 ---- */
  #profile-pane { flex: 1; display: flex; overflow: hidden; }
  #profile-pane[hidden] { display: none; }
  #pf-img-wrap { flex: 0 0 46%; overflow: auto; background: #525659; padding: 12px; }
  #pf-img-wrap img { display: block; width: 100%; background: #fff; }
  #pf-form { flex: 1; overflow-y: auto; padding: 10px 16px 60px; }
  #pf-form h3 { font-size: 13px; margin: 14px 0 6px; color: #444;
                border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .field { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .field > label { flex: 0 0 96px; font-size: 12px; color: #555; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    flex: 1; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px;
    font: inherit; font-size: 13px; }
  .field textarea { min-height: 46px; resize: vertical; }
  .field input[type=checkbox] { width: 16px; height: 16px; }
  .rep { border: 1px dashed var(--line); border-radius: 4px; padding: 6px;
         margin: 6px 0; position: relative; }
  .rep .del { position: absolute; right: 4px; top: 2px; padding: 0 6px;
              font-size: 11px; line-height: 16px; }
  .addbtn { font-size: 12px; padding: 2px 8px; }
  .pf-actions { position: sticky; bottom: 0; background: #fff; padding: 8px 0;
                border-top: 1px solid var(--line); display: flex; gap: 10px;
                align-items: center; }
  .pf-note { font-size: 12px; color: #b06a00; }
  .pf-note.ok { color: #1a8f3c; }
  #pf-errors { color: #c0392b; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button id="tab-panels" class="on">分格</button>
    <button id="tab-profile">介绍页</button>
  </div>
  <span class="rtl">RTL ▶ 从右往左读 · 1 号应在右上</span>
  <span class="stats" id="stats">候选 – / 当前框 –</span>
  <button id="save-btn">保存 (S)</button>
  <span class="hint">←/→ 切页 · S 保存 · D 删除选中框 · 空白处拖拽新建 · 拖角缩放</span>
</header>
<div id="layout">
  <ul id="page-list"></ul>
  <div id="viewport"><div id="stage"><img id="page-img" alt=""></div></div>
  <div id="profile-pane" hidden>
    <div id="pf-img-wrap"><img id="pf-img" alt=""></div>
    <div id="pf-form">
      <div class="pf-actions">
        <button id="pf-save">保存介绍页 (S)</button>
        <span id="pf-state" class="pf-note"></span>
      </div>
      <div id="pf-errors"></div>
      <div id="pf-fields"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { pages: [], current: null, meta: null, boxes: [], selected: -1,
                candidates: 0, isManual: false, mode: "panels",
                profile: null, enums: {}, known: [], shipErrors: [] };

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1600);
}
function api(path, opts) { return fetch(path, opts).then(r => r.json().then(j => ({status: r.status, body: j}))); }

async function loadPages() {
  const {body} = await api("/api/pages");
  state.pages = body.pages || [];
  const ul = $("page-list"); ul.innerHTML = "";
  for (const p of state.pages) {
    const li = document.createElement("li");
    const pm = p.profile === "reviewed" ? "●" : p.profile === "draft" ? "○" : "–";
    li.innerHTML = `<span>${p.name}</span><span><span class="pm ${p.profile}">${pm}</span>` +
      `<span class="mark ${p.confirmed ? "ok" : ""}">${p.confirmed ? "✓" : " "}</span></span>`;
    li.dataset.name = p.name;
    if (p.name === state.current) li.classList.add("current");
    li.onclick = () => loadPage(p.name);
    ul.appendChild(li);
  }
}

async function loadPage(name) {
  const {status, body} = await api(`/api/page/${name}/panels`);
  if (status !== 200) { toast(body.error || "load failed"); return; }
  state.current = name; state.isManual = body.is_manual;
  state.meta = body.data;
  state.boxes = (body.data.panels || []).map(p => ({...p}));
  state.selected = -1;
  const img = $("page-img");
  img.onload = () => { layoutStage(); renderBoxes(); };
  img.src = `/api/page/${name}/image?ts=${Date.now()}`;
  $("pf-img").src = `/api/page/${name}/image?ts=${Date.now()}`;
  const info = state.pages.find(p => p.name === name) || {};
  state.candidates = info.candidates ?? 0;
  [...$("page-list").children].forEach(li =>
    li.classList.toggle("current", li.dataset.name === name));
  updateStats();
  if (state.mode === "profile") await loadProfile(name);
}

function layoutStage() {
  const img = $("page-img"), st = $("stage");
  const maxW = $("viewport").clientWidth - 48;
  const maxH = $("viewport").clientHeight - 48;
  const scale = Math.min(maxW / state.meta.width, maxH / state.meta.height, 1);
  st.style.width = Math.round(state.meta.width * scale) + "px";
  st.style.height = Math.round(state.meta.height * scale) + "px";
}

function updateStats() {
  $("stats").textContent =
    `候选 ${state.candidates} / 当前框 ${state.boxes.length}` +
    (state.isManual ? " · 已确认(manual)" : " · 未确认(auto)");
}

function renderBoxes() {
  const st = $("stage");
  st.querySelectorAll(".box").forEach(b => b.remove());
  const mw = state.meta.width, mh = state.meta.height;
  const sorted = [...state.boxes].sort((a, b) => a.order - b.order);
  for (const box of sorted) {
    const d = document.createElement("div");
    d.className = "box" + (state.boxes.indexOf(box) === state.selected ? " selected" : "");
    d.style.left = (box.x / mw * 100) + "%";
    d.style.top = (box.y / mh * 100) + "%";
    d.style.width = (box.w / mw * 100) + "%";
    d.style.height = (box.h / mh * 100) + "%";
    d.dataset.idx = state.boxes.indexOf(box);
    const isFirst = box.order === 1;
    d.innerHTML = `<span class="badge ${isFirst ? "first" : ""}">${box.order}</span>` +
      `<span class="ctl"><button data-act="up" title="顺序上移">▲</button>` +
      `<button data-act="down" title="顺序下移">▼</button></span>` +
      `<span class="handle" title="拖角缩放"></span>`;
    st.appendChild(d);
  }
}

function renumber() {
  [...state.boxes].sort((a, b) => a.order - b.order)
    .forEach((b, i) => b.order = i + 1);
}

function select(idx) {
  state.selected = idx;
  renderBoxes();
}

function boxesFromEvent(ev, mode) {
  const st = $("stage"), r = st.getBoundingClientRect();
  const sx = state.meta.width / r.width, sy = state.meta.height / r.height;
  return {
    x: Math.round((ev.clientX - r.left) * sx),
    y: Math.round((ev.clientY - r.top) * sy),
    sx, sy,
  };
}

let drag = null;
$("stage").addEventListener("pointerdown", (ev) => {
  const boxEl = ev.target.closest(".box");
  const st = $("stage");
  const pt = boxesFromEvent(ev);
  if (ev.target.classList.contains("handle") && boxEl) {
    const box = state.boxes[+boxEl.dataset.idx];
    drag = {mode: "resize", idx: +boxEl.dataset.idx, ox: pt.x, oy: pt.y,
            w0: box.w, h0: box.h};
  } else if (boxEl) {
    const idx = +boxEl.dataset.idx;
    select(idx);
    const box = state.boxes[idx];
    drag = {mode: "move", idx, ox: pt.x, oy: pt.y, bx: box.x, by: box.y};
  } else {
    drag = {mode: "create", ox: pt.x, oy: pt.y};
    const ghost = document.createElement("div");
    ghost.className = "creating"; ghost.id = "ghost";
    st.appendChild(ghost);
  }
  st.setPointerCapture(ev.pointerId);
});
$("stage").addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const pt = boxesFromEvent(ev);
  if (drag.mode === "move") {
    const box = state.boxes[drag.idx];
    box.x = Math.max(0, Math.min(state.meta.width - box.w, Math.round(drag.bx + (pt.x - drag.ox))));
    box.y = Math.max(0, Math.min(state.meta.height - box.h, Math.round(drag.by + (pt.y - drag.oy))));
    renderBoxes();
  } else if (drag.mode === "resize") {
    const box = state.boxes[drag.idx];
    box.w = Math.max(8, Math.min(state.meta.width - box.x, drag.w0 + Math.round(pt.x - drag.ox)));
    box.h = Math.max(8, Math.min(state.meta.height - box.y, drag.h0 + Math.round(pt.y - drag.oy)));
    renderBoxes();
  } else if (drag.mode === "create") {
    const g = $("ghost");
    if (!g) return;
    const x = Math.min(drag.ox, pt.x), y = Math.min(drag.oy, pt.y);
    const w = Math.abs(pt.x - drag.ox), h = Math.abs(pt.y - drag.oy);
    const st = $("stage");
    g.style.left = (x / state.meta.width * 100) + "%";
    g.style.top = (y / state.meta.height * 100) + "%";
    g.style.width = (w / state.meta.width * 100) + "%";
    g.style.height = (h / state.meta.height * 100) + "%";
  }
});
$("stage").addEventListener("pointerup", (ev) => {
  if (drag && drag.mode === "create") {
    const pt = boxesFromEvent(ev);
    const x = Math.min(drag.ox, pt.x), y = Math.min(drag.oy, pt.y);
    const w = Math.abs(pt.x - drag.ox), h = Math.abs(pt.y - drag.oy);
    $("ghost")?.remove();
    if (w >= 8 && h >= 8) {
      const maxOrder = state.boxes.reduce((m, b) => Math.max(m, b.order), 0);
      state.boxes.push({
        id: "p" + (Math.max(0, ...state.boxes.map(b => +String(b.id).replace(/\D/g, "") || 0)) + 1),
        order: maxOrder + 1, x, y, w, h, confidence: 0.5, locked: false,
      });
      state.selected = state.boxes.length - 1;
      state.isManual = true;
      renderBoxes(); updateStats();
    }
  }
  drag = null;
});

$("stage").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".ctl button");
  if (!btn) return;
  const boxEl = ev.target.closest(".box");
  const idx = +boxEl.dataset.idx;
  const dir = btn.dataset.act === "up" ? -1 : 1;
  const cur = state.boxes[idx];
  const other = state.boxes.find(b => b.order === cur.order + dir);
  if (other) { [cur.order, other.order] = [other.order, cur.order]; }
  renumber(); renderBoxes();
});

async function save() {
  if (!state.current || !state.boxes.length) { toast("没有可保存的框"); return; }
  const {status, body} = await api(`/api/page/${state.current}/panels`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({panels: state.boxes}),
  });
  if (status === 200) {
    toast(`已保存 ${body.count} 框（source=manual）`);
    state.isManual = true;
    await loadPages();
    updateStats();
  } else { toast(body.error || "save failed"); }
}
$("save-btn").onclick = save;

document.addEventListener("keydown", (ev) => {
  if (ev.key === "s" || ev.key === "S") { save(); return; }
  if (ev.key === "d" || ev.key === "D") {
    if (state.selected >= 0) {
      state.boxes.splice(state.selected, 1);
      state.selected = -1; renumber(); renderBoxes(); updateStats();
    }
    return;
  }
  if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
    const idx = state.pages.findIndex(p => p.name === state.current);
    const next = ev.key === "ArrowLeft" ? idx - 1 : idx + 1;
    if (next >= 0 && next < state.pages.length) loadPage(state.pages[next].name);
  }
});

window.addEventListener("resize", () => { if (state.meta) { layoutStage(); renderBoxes(); } });

/* ================= 介绍页校对 ================= */
const PF_SCALARS = [
  ["layout.kind", "页面类型", "enum"],
  ["layout.text_density", "文字密度", "enum"],
  ["layout.panel_count", "分格数", "int"],
  ["layout.has_splash", "跨页大图", "bool"],
  ["layout.borderless", "无边框", "bool"],
  ["story.beat", "叙事节拍", "enum"],
  ["story.summary", "一句话剧情", "text"],
  ["story.location", "场景地点", "text"],
  ["story.time_of_day", "时间", "enum"],
  ["story.weather", "室内外/天气", "enum"],
  ["story.emotion", "情绪", "enum"],
  ["story.continuity", "衔接", "enum"],
  ["text.verbatim_complete", "台词读全", "bool"],
  ["text.ocr_confidence", "转录置信度", "num"],
  ["text.narration_boxes", "旁白框", "list"],
  ["text.sfx", "拟声词", "list"],
  ["visual.shot", "景别", "enum"],
  ["visual.composition", "构图", "text"],
  ["visual.key_props", "关键道具", "list"],
  ["visual.palette", "配色", "list"],
  ["visual.motion_hint", "运镜提示", "enum"],
  ["reuse.replaceable", "可替换", "bool"],
  ["reuse.replace_strategy", "替换策略", "enum"],
  ["reuse.scene_tags", "场景标签", "list"],
  ["reuse.asset_brief", "素材需求", "area"],
  ["reuse.blocking_reason", "不可替换原因", "text"],
  ["provenance.reviewer_notes", "校对备注", "area"],
];
const PF_GROUPS = [
  ["版面", ["layout.kind", "layout.text_density", "layout.panel_count",
            "layout.has_splash", "layout.borderless"]],
  ["剧情", ["story.beat", "story.summary", "story.location", "story.time_of_day",
            "story.weather", "story.emotion", "story.continuity"]],
  ["台词", ["text.verbatim_complete", "text.ocr_confidence", "text.narration_boxes",
            "text.sfx"]],
  ["画面", ["visual.shot", "visual.composition", "visual.key_props",
            "visual.palette", "visual.motion_hint"]],
  ["复用", ["reuse.replaceable", "reuse.replace_strategy", "reuse.scene_tags",
            "reuse.asset_brief", "reuse.blocking_reason"]],
  ["审阅", ["provenance.reviewer_notes"]],
];

function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val) {
  const keys = path.split(".");
  let cur = obj;
  for (const k of keys.slice(0, -1)) {
    if (cur[k] == null || typeof cur[k] !== "object") cur[k] = {};
    cur = cur[k];
  }
  cur[keys[keys.length - 1]] = val;
}
function el(tag, attrs, kids) {
  const d = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") d.className = v;
    else if (k.startsWith("on")) d.addEventListener(k.slice(2), v);
    else d.setAttribute(k, v);
  }
  for (const kid of kids || []) d.append(kid);
  return d;
}
function enumSelect(path, value, onChange) {
  const list = state.enums["$." + path] || [];
  const s = el("select");
  for (const v of list) {
    const o = el("option", {value: v}, [document.createTextNode(v)]);
    if (v === value) o.selected = true;
    s.append(o);
  }
  s.onchange = () => onChange(s.value);
  return s;
}

async function loadProfile(name) {
  const {status, body} = await api(`/api/page/${name}/profile`);
  if (status !== 200) {
    $("pf-fields").innerHTML = "";
    $("pf-errors").textContent = body.error || "没有介绍页（先跑 m1 profile）";
    $("pf-state").textContent = "";
    state.profile = null;
    return;
  }
  state.profile = body.data;
  state.enums = body.enums || {};
  state.known = body.known_names || [];
  state.shipErrors = body.shippable_errors || [];
  renderProfile();
}

function renderProfile() {
  const p = state.profile, host = $("pf-fields");
  host.innerHTML = "";
  if (!p) return;
  for (const [title, paths] of PF_GROUPS) {
    host.append(el("h3", {}, [document.createTextNode(title)]));
    for (const path of paths) {
      const spec = PF_SCALARS.find(s => s[0] === path);
      if (!spec) continue;
      const [, label, kind] = spec;
      let input;
      const cur = getPath(p, path);
      if (kind === "enum") {
        input = enumSelect(path, cur, v => setPath(p, path, v));
      } else if (kind === "bool") {
        input = el("input", {type: "checkbox"});
        input.checked = !!cur;
        input.onchange = () => setPath(p, path, input.checked);
      } else if (kind === "int" || kind === "num") {
        input = el("input", {type: "number", step: kind === "int" ? "1" : "0.01"});
        input.value = cur ?? 0;
        input.oninput = () => setPath(p, path, kind === "int"
          ? parseInt(input.value || "0", 10) : parseFloat(input.value || "0"));
      } else if (kind === "list") {
        input = el("input", {type: "text"});
        input.value = Array.isArray(cur) ? cur.join(", ") : "";
        input.oninput = () => setPath(p, path,
          input.value.split(/[,，]/).map(s => s.trim()).filter(Boolean));
      } else if (kind === "area") {
        input = el("textarea");
        input.value = cur ?? "";
        input.oninput = () => setPath(p, path, input.value);
      } else {
        input = el("input", {type: "text", maxlength: path === "story.summary" ? "40" : "200"});
        input.value = cur ?? "";
        input.oninput = () => setPath(p, path, input.value);
      }
      host.append(el("div", {class: "field"}, [el("label", {}, [document.createTextNode(label)]), input]));
    }
  }
  host.append(el("h3", {}, [document.createTextNode("人物")]));
  host.append(repList("story.characters", [
    ["name", "text"], ["role", "enum:$.story.characters.items.properties.role"],
    ["region", "enum:$.story.characters.items.region"],
    ["expression", "text"],
  ], {name: "主角", role: "protagonist", region: "center", expression: "平静"}));
  host.append(el("h3", {}, [document.createTextNode("对白气泡")]));
  host.append(repList("text.bubbles", [
    ["speaker", "text"], ["text", "text"],
    ["region", "enum:$.text.bubbles.items.region"],
    ["is_shout", "bool"],
  ], {speaker: "", text: "", region: "center", is_shout: false}));
  updateProfileState();
}

function repList(path, cols, blank) {
  const wrap = el("div");
  const list = getPath(state.profile, path) || [];
  if (!Array.isArray(list)) setPath(state.profile, path, []);
  const arr = getPath(state.profile, path);
  const redraw = () => {
    [...wrap.querySelectorAll(".rep")].forEach(n => n.remove());
    arr.forEach((item, idx) => {
      const box = el("div", {class: "rep"});
      box.append(el("button", {class: "del", onclick: () => {
        arr.splice(idx, 1); redraw();
      }}, [document.createTextNode("删除")]));
      for (const [key, kind] of cols) {
        let input;
        if (kind.startsWith("enum:")) {
          const realPath = kind.slice(5);
          input = enumSelect(realPath, item[key], v => item[key] = v);
        } else if (kind === "bool") {
          input = el("input", {type: "checkbox"});
          input.checked = !!item[key];
          input.onchange = () => item[key] = input.checked;
        } else {
          input = el("input", {type: "text"});
          input.value = item[key] ?? "";
          input.oninput = () => item[key] = input.value;
        }
        box.append(el("div", {class: "field"},
          [el("label", {}, [document.createTextNode(key)]), input]));
      }
      wrap.append(box);
    });
    wrap.append(el("button", {class: "addbtn", onclick: () => {
      arr.push({...blank}); redraw();
    }}, [document.createTextNode("+ 增加一行")]));
  };
  redraw();
  return wrap;
}

function updateProfileState() {
  const p = state.profile;
  if (!p) return;
  const rev = (p.provenance || {}).reviewed;
  const s = $("pf-state");
  s.textContent = rev ? "已审阅" : "未审阅（草稿）";
  s.className = "pf-note" + (rev ? " ok" : "");
}

async function saveProfile() {
  if (!state.profile || !state.current) { toast("没有介绍页可保存"); return; }
  const p = state.profile;
  if (p.reuse && !p.reuse.blocking_reason) p.reuse.blocking_reason = null;
  const body = {
    layout: p.layout, story: p.story, text: p.text, visual: p.visual,
    reuse: p.reuse,
    reviewer_notes: (p.provenance || {}).reviewer_notes || "",
  };
  const {status, resp} = await fetch(`/api/page/${state.current}/profile`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  }).then(async r => ({status: r.status, resp: await r.json()}));
  if (status === 200) {
    $("pf-errors").textContent = "";
    p.provenance.reviewed = true;
    state.shipErrors = resp.shippable_errors || [];
    $("pf-state").textContent = state.shipErrors.length
      ? "已审阅 · 但还不能出片：" + state.shipErrors.join("；")
      : "已审阅 · 可出片";
    $("pf-state").className = "pf-note" + (state.shipErrors.length ? "" : " ok");
    toast("介绍页已保存");
    await loadPages();
  } else {
    $("pf-errors").textContent = (resp.errors || [resp.error || "保存失败"]).join("\n");
    toast(resp.error || "保存失败");
  }
}
$("pf-save").onclick = saveProfile;

function setMode(mode) {
  state.mode = mode;
  $("tab-panels").classList.toggle("on", mode === "panels");
  $("tab-profile").classList.toggle("on", mode === "profile");
  $("viewport").hidden = mode !== "panels";
  $("profile-pane").hidden = mode !== "profile";
  $("save-btn").hidden = mode !== "panels";
  if (mode === "profile" && state.current) loadProfile(state.current);
}
$("tab-panels").onclick = () => setMode("panels");
$("tab-profile").onclick = () => setMode("profile");

document.addEventListener("keydown", (ev) => {
  if ((ev.key === "s" || ev.key === "S") && state.mode === "profile") {
    ev.preventDefault(); saveProfile();
  }
});

loadPages().then(() => { if (state.pages.length) loadPage(state.pages[0].name); });
</script>
</body>
</html>
